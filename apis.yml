name: Talofa Games
description: >-
  Talofa Games is a mobile game developer and publisher backed by Andreessen
  Horowitz (a16z). The studio builds social fitness games that turn real-world
  physical activity into cooperative multiplayer play. Its flagship title, Run
  Legends, is a free-to-play running RPG available on iOS and Android in which
  players' real-world runs and walks power team battles against monsters, and
  its newer title Monster Walk is in closed beta. Talofa Games is a
  consumer mobile-gaming company and does not publish a public developer API,
  SDK, or developer portal; this API Evangelist profile captures its company
  identity and public web presence rather than an API surface.
